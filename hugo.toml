baseURL = "https://notes-automate.com/"
locale = "en-US"
title = "Obsidian Plugins Guide"
theme = "PaperMod"

[languages]
  [languages.en]
    label = "English"
    weight = 1
    contentDir = "content/en"
  [languages.zh-cn]
    label = "简体中文"
    weight = 2
    contentDir = "content/zh-cn"

[params]
  description = "The best Obsidian plugins, themes, and tips to supercharge your note-taking."
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "auto"

  [params.homeInfoParams]
    Title = "Obsidian Plugins & Tips"
    Content = "Discover the best plugins, themes, and workflows to level up your vault."

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1

[markup]
  [markup.goldmark.renderer]
    unsafe = true
